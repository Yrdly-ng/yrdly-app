name: Expire checkout reservations

on:
  schedule:
    - cron: '2-57/5 * * * *'

permissions: {}
concurrency:
  group: checkout-reservation-expiry
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Expire unpaid checkout reservations
        env:
          PAYOUT_RECOVERY_CRON_SECRET: ${{ secrets.PAYOUT_RECOVERY_CRON_SECRET }}
        run: |
          test -n "$PAYOUT_RECOVERY_CRON_SECRET"
          curl --fail --silent --show-error --max-time 65 \
            --connect-to app.yrdly.ng:443:cname.vercel-dns-0.com:443 \
            --header "Authorization: Bearer $PAYOUT_RECOVERY_CRON_SECRET" \
            https://app.yrdly.ng/api/cron/expire-checkout-reservations
